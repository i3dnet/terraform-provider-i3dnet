# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    env:
      I3D_API_KEY: ${{ secrets.I3D_API_KEY }}
      I3D_FLEXMETAL_API_KEY: ${{ secrets.I3D_FLEXMETAL_API_KEY }}
      I3D_FLEXVM_API_KEY: ${{ secrets.I3D_FLEXVM_API_KEY }}
    needs: build
    runs-on: ubuntu-latest
    # A real FlexMetal delivery alone can take 10+ minutes; leave room above the test step's limit for setup.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The lowest supported version (1.0, the first one with plugin
        # protocol 6) and the three latest Terraform minor versions.
        # FlexVM tests run only on the `main` entry.
        terraform:
          - version: '1.0.*'
          - version: '1.15.*'
          - version: '1.16.*'
          - version: '1.17.*'
            main: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform.version }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
          TF_MAIN: ${{ matrix.terraform.main || 'false' }}
          # Long-lived networks of the test account for TestAccFlexmetalServerNetworks (FM-5404).
          I3D_TEST_NETWORK_PUBLIC_ID: ${{ vars.I3D_TEST_NETWORK_PUBLIC_ID }}
          I3D_TEST_NETWORK_L2_ID: ${{ vars.I3D_TEST_NETWORK_L2_ID }}
          ACCTEST_TIMEOUT: "25m"
        run: go test -v -cover -timeout 25m ./internal/...
        # Above go test's own -timeout, so a hang ends in Go's timeout panic (which names the stuck test) instead
        # of the runner killing the step without output.
        timeout-minutes: 27