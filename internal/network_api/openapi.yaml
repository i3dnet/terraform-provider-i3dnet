                createFailed:
                  summary: The last operation failed
                  value:
                    title: "Operation pending"
                    status: 409
                    detail: "the last operation on this prefix failed and the prefix cannot be changed; check its operation for the reason, then delete it or create a new prefix"
                    code: "E020024"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Unprocessable Content - the body parses but is not a valid
            patch, or `prefixId` is not a well-formed UUID; nothing
            changes (code E020001). `detail` names the member or
            parameter: `customerDescription` is empty after trimming,
            longer than 200 characters, or contains control characters;
            `customerDescription` is not a string or `null`; or the body
            carries a member other than `customerDescription` (including
            `description`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                emptyDescription:
                  summary: Whitespace-only description
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "customerDescription must not be empty or whitespace-only; send null to clear the description or a non-empty value to set it"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                descriptionTooLong:
                  summary: Description longer than 200 characters
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "customerDescription must be at most 200 characters"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                opsDescription:
                  summary: The description member cannot be edited here
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "description is not patchable; the only patchable member is customerDescription"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                malformedPrefixId:
                  summary: prefixId is not a UUID
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "prefixId is not a valid UUID"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a prefix (guarded, asynchronous)
      description: |
        On public/gateway mounts every resource write, including retries, requires an explicit owned
        contract registration (409 E020048). Internal operations retain their existing authorization
        rules. Ownership, managed-resource and lifecycle guards remain. Cleanup adds no contract input.
        Tears down the prefix: the records (the prefix, its
        VLAN-scoped gateway objects, and its reserved addresses) are
        removed and the routers are deconfigured. Refused with `409`
        (code E020014) while ANY customer IP address is still in use
        under the prefix, whatever its retention - infrastructure
        addresses (`role` of `gateway`, `router-ip`, or `reserved`)
        never block; the teardown removes them itself. Otherwise
        returns `202` with an operation reference; the operation is
        served by `GET /prefixes/{prefixId}/operation`.

        Deleting the last remaining prefix of a network is allowed and
        leaves a valid empty network: the network, its state, and its
        VLAN are untouched - deleting the network remains the only way
        to remove them.

        Idempotent: repeating the `DELETE` while a teardown is running
        returns `202` referencing the same operation, and repeating it
        after a failed teardown continues it instead of failing. Once
        the teardown has completed, the prefix reads as `404` (`GET`
        and `DELETE` alike) and no longer appears in listings - the
        completed operation is your confirmation.
      operationId: deletePrefix
      x-required-permission: network:prefix:delete
      x-required-permission-description: Delete a prefix from your account.
      x-audience: customer-facing
      tags:
        - Prefixes
      responses:
        '202':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Accepted - teardown is running. `links.operation` is the
            operation reference; a repeated `DELETE` returns the
            operation reference of the teardown it continues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixDeleteAccepted'
              examples:
                accepted:
                  summary: Delete accepted
                  value:
                    id: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                    links:
                      operation:
                        href: "/prefixes/01984f2e-bb02-7cc3-9d22-2f27adccf222/operation"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Not Found - the prefix does not exist on your account, or it
            was already deleted (code E020002).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                alreadyDeleted:
                  summary: Re-delete after a completed teardown
                  value:
                    title: "Prefix not found"
                    status: 404
                    detail: "prefix 01984f2e-bb02-7cc3-9d22-2f27adccf222 does not exist"
                    code: "E020002"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Public mutation without explicit owned registration is E020048.
            Managed-resource protection E020019, missing verified parent association E020044, pending create E020024, parent unavailable E020042, or existing IP addresses E020014. Accepted teardown retries need no allocation or fresh inventory.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                platformManaged:
                  summary: The prefix is managed by i3D.net
                  value:
                    title: "Resource is managed by i3D.net"
                    status: 409
                    detail: "this prefix was set up by i3D.net on your behalf and is managed by i3D.net. It is removed automatically, and cannot be changed, deleted or claimed into here. Contact i3D.net support if you need it changed or removed."
                    code: "E020019"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                addressesInUse:
                  summary: Delete blocked by IP addresses in use
                  value:
                    title: "Delete blocked by IP addresses in use"
                    status: 409
                    detail: "prefix 01984f2e-bb02-7cc3-9d22-2f27adccf222 still holds 2 IP addresses in use (e.g. 01984f2e-aa01-7bb2-8c11-1f27adccf111); decommission the servers using them, then retry the delete"
                    code: "E020014"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '422':
          $ref: '#/components/responses/MalformedPathParameter'
        '500':
          $ref: '#/components/responses/InternalError'

  /prefixes/{prefixId}/operation:
