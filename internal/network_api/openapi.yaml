    get:
      summary: Get a prefix
      description: |
        Returns the prefix, extended with
        the availability counters `capacity`, `allocated`, and
        `available` - the same definitions as the IP-address listing
        under the prefix (`available` excludes the positionally reserved
        addresses whether or not they are materialized). The counters
        cost one extra lookup, which is why the prefix LISTING
        does not carry them. A UUID that does not exist or is owned by
        another account reads as `404` (default deny - existence is not
        disclosed).

        While a local lifecycle record exists (create in flight, or a
        retained failed tombstone), `state` reports the lifecycle value
        (`provisioning` / `failed`) and `links` carries the operation
        reference (`links.operation`) alongside `self`.
      operationId: getPrefixById
      x-required-permission: network:prefix:read
      x-required-permission-description: Read a prefix and its provisioning status.
      x-audience: customer-facing
      tags:
        - Prefixes
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixDetailResponse'
              examples:
                active:
                  summary: An active prefix with its availability counters
                  value:
                    id: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                    cidr: "10.0.0.0/24"
                    family: 4
                    state: "active"
                    fabric: "montreal-a"
                    metro: "Montreal"
                    customerDescription: "edge pool, EU traffic"
                    vlanId: 3042
                    gatewayIp: "10.0.0.1"
                    routerIps:
                      - "10.0.0.2"
                      - "10.0.0.3"
                    connectivity:
                      type: public
                    networkId: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                    retention: "persistent"
