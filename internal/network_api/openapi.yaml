    delete:
      summary: Delete a prefix (guarded, asynchronous)
      description: |
        Tears down the prefix: the records (the prefix, its
        VLAN-scoped gateway objects, and its reserved addresses) are
        removed and the routers are deconfigured. Refused with `409`
        (code E020014) while ANY customer IP address is still in use
        under the prefix, whatever its retention - infrastructure
        addresses (`role` of `gateway`, `router-ip`, or `reserved`)
        never block; the teardown removes them itself. Otherwise
        returns `202` with an operation reference; the operation is
        served by `GET /prefixes/{prefixId}/operation`.

        Deleting the last remaining prefix of a network is allowed and
        leaves a valid empty network: the network, its state, and its
        VLAN are untouched - deleting the network remains the only way
        to remove them.

        Idempotent: repeating the `DELETE` while a teardown is running
        returns `202` referencing the same operation, and repeating it
        after a failed teardown continues it instead of failing. Once
        the teardown has completed, the prefix reads as `404` (`GET`
        and `DELETE` alike) and no longer appears in listings - the
        completed operation is your confirmation.
      operationId: deletePrefix
      x-required-permission: network:prefix:delete
      x-required-permission-description: Delete a prefix from your account.
      x-audience: customer-facing
      tags:
        - Prefixes
      responses:
        '202':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Accepted - teardown is running. `links.operation` is the
            operation reference; a repeated `DELETE` returns the
            operation reference of the teardown it continues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixDeleteAccepted'
              examples:
                accepted:
                  summary: Delete accepted
                  value:
                    id: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                    links:
                      operation:
                        href: "/prefixes/01984f2e-bb02-7cc3-9d22-2f27adccf222/operation"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Not Found - the prefix does not exist on your account, or it
            was already deleted (code E020002).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                alreadyDeleted:
                  summary: Re-delete after a completed teardown
                  value:
                    title: "Prefix not found"
                    status: 404
                    detail: "prefix 01984f2e-bb02-7cc3-9d22-2f27adccf222 does not exist"
                    code: "E020002"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Conflict - the prefix is managed by i3D.net and is read-only
            here (code E020019), or the contract the prefix is held under
            does not authorise its type for your account (code E020032), or
            the delete is blocked because customer IP addresses are still in
            use under the prefix (code E020014).
            They are answered in that order, for the same reasons as on the
            network delete: someone who cannot clear the blocking addresses
            must not be told to clear them, and a contract does not make a
            managed prefix deletable.
            The check uses the prefix's OWN recorded contract, never your
            account's other contracts; a prefix with no recorded contract is
            not checked. Never E020018, which is returned only by the network
            delete.
            Re-driving an already accepted teardown is never refused by
            E020032 or E020019.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                platformManaged:
                  summary: The prefix is managed by i3D.net
                  value:
                    title: "Resource is managed by i3D.net"
                    status: 409
                    detail: "this prefix was set up by i3D.net on your behalf and is managed by i3D.net. It is removed automatically, and cannot be changed, deleted or claimed into here. Contact i3D.net support if you need it changed or removed."
                    code: "E020019"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                contractNotAuthorised:
                  summary: The prefix's contract does not authorise its type
                  value:
                    title: "Contract does not authorise removing this resource"
                    status: 409
                    detail: "contract PD-2026-000481 does not authorise removing prefixes on this account; contact i3D.net support to have this resource type added to the contract"
                    code: "E020032"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                addressesInUse:
                  summary: Delete blocked by IP addresses in use
                  value:
                    title: "Delete blocked by IP addresses in use"
                    status: 409
                    detail: "prefix 01984f2e-bb02-7cc3-9d22-2f27adccf222 still holds 2 IP addresses in use (e.g. 01984f2e-aa01-7bb2-8c11-1f27adccf111); decommission the servers using them, then retry the delete"
                    code: "E020014"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '422':
          $ref: '#/components/responses/MalformedPathParameter'
        '500':
          $ref: '#/components/responses/InternalError'

  /prefixes/{prefixId}/operation:
    get:
      summary: Get a prefix's current or last operation
      description: |
        Returns the async operation attached to the prefix:
