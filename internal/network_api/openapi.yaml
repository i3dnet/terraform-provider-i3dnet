                    status: 409
                    detail: "a delete operation is in progress or has failed for prefix 01984f2e-bb02-7cc3-9d22-2f27adccf222; a deleted identity is never re-created - use a new UUID for a new prefix"
                    code: "E020003"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                quotaExceededInNetwork:
                  summary: Prefix limit for the network reached
                  value:
                    title: "Quota exceeded"
                    status: 409
                    detail: "your limit of 4 prefixes in this network under contract PD-2026-000481 has been reached (4 in use); release one you no longer need from contract PD-2026-000481 in this network, or contact i3D.net support to request a higher limit"
                    code: "E020016"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                quotaExceededForAccount:
                  summary: Prefix limit under one contract reached
                  value:
                    title: "Quota exceeded"
                    status: 409
                    detail: "your limit of 100 prefixes under contract PD-2026-000481 has been reached (100 in use); release one you no longer need from contract PD-2026-000481, or contact i3D.net support to request a higher limit"
                    code: "E020016"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                contractNotAuthorised:
                  summary: The contractId does not authorise this prefix type
                  value:
                    title: "Contract does not authorise this resource"
                    status: 409
                    detail: "contract PD-2026-000481 does not authorise creating prefixes on this account; use a contract that covers this resource type, or contact i3D.net support to have it added to the contract"
                    code: "E020031"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Unprocessable Content - the request parses but fails
            validation; nothing is created (code E020001).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unknownNetwork:
                  summary: Unknown networkId (never auto-created)
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "network 01984f2e-1c3a-7d21-9d10-3542f27ad999 does not exist; create the network first - it is never created as a side effect"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                explicitCidrNotSupported:
                  summary: Explicit cidr is not supported (provider selects the subnet)
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "an explicit cidr is not supported: the provider selects the concrete subnet during provisioning; state a 'size' instead"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                sizeAboveCap:
                  summary: Requested block larger than the cap
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "size /22 exceeds the /24 cap; request /24 or smaller"
