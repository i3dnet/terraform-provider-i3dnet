        failed, or completed delete. This is the resource behind the
        `links.operation` reference returned by `PUT` and `DELETE` on
        `/prefixes/{prefixId}`; an idempotent replay of either returns
        the SAME reference to this resource. `404` when no operation
        record exists for the UUID (unknown prefix, another account's, or
        nothing recorded). Once a create has succeeded, the provisioned
        prefix is discoverable via `filters[networkId][eq]` on the
        prefix listing.
