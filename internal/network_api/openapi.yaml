                    status: 409
                    detail: "this prefix is being provisioned and cannot be changed yet; wait for the operation to finish, then retry"
                    code: "E020024"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                deleteInProgress:
                  summary: A delete is in progress
                  value:
                    title: "Operation pending"
                    status: 409
                    detail: "this prefix has a delete in progress and cannot be changed; once the delete completes the prefix no longer exists"
                    code: "E020024"
