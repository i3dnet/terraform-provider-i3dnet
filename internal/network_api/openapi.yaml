  /prefixes/{prefixId}/ip-addresses:
    parameters:
      - in: path
        name: prefixId
        description: |
          UUID of the owning prefix. Any well-formed UUID is accepted -
          a prefix that does not exist or belongs to another account
          reads as `404` (default deny - existence is not disclosed).
        required: true
        schema:
          type: string
          format: uuid
        example: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
    get:
      summary: List all IP addresses under a prefix
      description: |
        Lists ALL IP addresses that exist under the referenced prefix - allocated addresses and infrastructure
        addresses alike. Addresses recorded as the
        prefix's gateway or a router address carry a `role` field
        (`gateway` / `router-ip`), derived by the same rules that
        populate the prefix's `gatewayIp` / `routerIps` fields, so the
        listing and the prefix representation never disagree. Positional
        reservations (the first usable addresses, held for future
        infrastructure) carry
        `role: "reserved"`. Addresses without an infrastructure role
        omit the field (never `null`). Nothing is synthesized: a prefix
        whose gateway/router addresses were never created
        lists none, and a positional reservation appears only once it
        has been materialized.

        Availability is exposed as counters only (`capacity`,
        `allocated`, `available`). Free addresses are NEVER enumerated
        in any response. `allocated` counts ALL IP address objects under
        the prefix - allocated and infrastructure alike - so the total
        of `items` across all pages equals `allocated`. `available`
        excludes the positionally reserved addresses whether or not
        they are materialized: it is the number of addresses that can
        still be allocated.

        Cursor-paginated. The listing reads live address data - it is
        not a cached copy. A prefix
        that does not exist or belongs to another account reads as
        `404` (default deny, code E020002) - existence is never
        disclosed.
      operationId: listPrefixIPAddresses
      x-required-permission: network:ip-address:list
      x-required-permission-description: List the IP addresses in your networks and prefixes.
      x-audience: customer-facing
      tags:
        - IP Addresses
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK - one page of IP address objects, with counters
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPAddressListResponse'
              examples:
                page:
                  summary: Every address under the prefix, with counters
                  value:
                    items:
                      - id: "01984f2e-aa01-7bb2-8c11-1f27adccf111"
                        address: "10.0.0.1"
                        family: 4
                        prefixId: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                        role: "gateway"
                        created: "2026-07-27T09:00:00Z"
                        links:
                          self:
                            href: "/prefixes/01984f2e-bb02-7cc3-9d22-2f27adccf222/ip-addresses/01984f2e-aa01-7bb2-8c11-1f27adccf111"
                      - id: "01984f2e-aa04-7bb2-8c11-1f27adccf114"
                        address: "10.0.0.4"
                        family: 4
                        prefixId: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                        role: "reserved"
                        created: "2026-07-27T09:00:00Z"
                        links:
                          self:
                            href: "/prefixes/01984f2e-bb02-7cc3-9d22-2f27adccf222/ip-addresses/01984f2e-aa04-7bb2-8c11-1f27adccf114"
                      - id: "01984f2e-aa02-7bb2-8c11-1f27adccf112"
                        address: "10.0.0.10"
                        family: 4
