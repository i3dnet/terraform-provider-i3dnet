openapi: 3.0.3
info:
  title: i3D.net Network API
  version: 0.1.0
  description: |
    Create and manage your networks, prefixes and IP addresses at
    i3D.net.

    You declare what you want - a network in a location, a prefix of a
    given size - and i3D.net provisions it. You never pick a VLAN, a
    subnet or a router: those are chosen for you.

    **Base path.** The paths in this document are relative to the API
    base URL. `/networks/{networkId}` means
    `{base}/networks/{networkId}`.

    **Your account.** Every request acts as the account you authenticate
    as. There is no account parameter: listings return your own
    resources, and a resource that belongs to someone else reads as
    `404` - the API never confirms that it exists.

    **IP addresses are read-only.** You do not claim or release
    addresses yourself. i3D.net allocates them when a server is
    provisioned and releases them when it is torn down. This API shows
    you the result: `GET` on the network-, prefix- and address-level
    listings and reads.

    **Asynchronous work.** Creating and deleting a network or a prefix
    returns `202` with a link to an operation resource. Poll that
    operation, or read the resource's `state`, to find out when the work
    finished.

    **Errors.** Every error response is `application/problem+json`
    (RFC 9457) with a stable machine-readable `code` (`E` followed by six
    digits - the full list is in the `ProblemDetails` schema) and a
    `traceId`. Quote the `traceId` when you contact support: it is how
    i3D.net finds your request.

    Every response, successful or failed, also carries an `X-Request-Id`
    header holding that same value, so it is available even on a response
    with no body to read it from.

    **Pagination.** Every listing is cursor-paginated: ask for a page
    size with `limit` and follow the `links.next` / `links.prev` URLs.
    There are no page numbers and no total counts. Cursors are opaque -
    do not build or read them yourself.

    **Caching.** Every representation carries a strong `ETag` response
    header. `If-Match` is not required. `PUT` only ever creates (it never
    replaces an existing resource), so there is no lost-update risk
    there. `PATCH /networks/{networkId}` changes one label, `name`, and
    is last-write-wins: the next read shows the result, so a lost update
    is visible and easy to repair without a precondition.

    **Permissions.** Each operation names the permission it needs under
    `x-required-permission` (`network:<resource>:<action>`) and describes
    it in `x-required-permission-description`. Your credentials decide
    which of them you hold.

    **Compatibility.** Fields with no value are left out of the response
    rather than sent as `null`, and new fields and new values may be
    added over time. Tolerate both.

servers:
  - url: /v3/public
    description: Network API - the paths below are relative to your API base URL
paths:
  /networks:
    get:
      summary: List networks
      description: |
        Lists your networks. Only networks on your own account appear,
        whatever parameters you send. Cursor-paginated; filters use the
        `filters[field][op]` syntax - supported: `filters[fabric][eq]`,
        `filters[state][eq]`, `filters[name][contains]`. An unknown
        filter field, or a known field with an unsupported operator, is
        a `400` (code E020013) - never silently
        ignored. Networks in the internal `deleted` state never appear.
      operationId: listNetworks
      x-required-permission: network:network:list
      x-required-permission-description: List the networks on your account.
      x-audience: customer-facing
      tags:
        - Networks
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: filters[fabric][eq]
          description: Filter by public fabric identifier.
          required: false
          schema:
            type: string
          example: "montreal-a"
        - in: query
          name: filters[state][eq]
          description: |
            Filter by network state. `deleted` is not a valid filter value -
            deleted networks are never visible on this API.
          required: false
          schema:
            type: string
            enum: [provisioning, active, failed]
          example: "active"
        - in: query
          name: filters[name][contains]
          description: |
            Case-insensitive substring match on the network's `name`,
            evaluated datastore-side. Unnamed networks never match. An
            empty or whitespace-only value reads as if the filter were
            absent. LIKE wildcard characters in the value are treated as
            literals - the value never acts as a pattern.
          required: false
          schema:
            type: string
          example: "web"
      responses:
        '200':
          description: OK - one page of your networks
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkListResponse'
              examples:
                page:
                  summary: One page of networks, with a next page to follow
                  value:
                    items:
                      - id: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                        state: "active"
                        connectivity:
                          type: "public"
                        fabric: "montreal-a"
                        name: "web tier"
                        vlanId: 3042
                        addressing:
                          source: "provider"
                        retention: "persistent"
                        createdAt: "2026-07-27T09:00:00Z"
                        updatedAt: "2026-07-27T09:02:11Z"
                        links:
                          self:
                            href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf"
                          prefixes:
                            href: "/prefixes?filters[networkId][eq]=01984f2e-1c3a-7d21-9d10-3542f27adccf"
                          ipAddresses:
                            href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf/ip-addresses"
                      - id: "01984f2e-2d4b-7e32-8b21-4653f38bedd0"
                        state: "provisioning"
                        connectivity:
                          type: "private"
                          routing:
                            enabled: false
                        fabric: "rotterdam-a"
                        name: "db tier"
                        addressing:
                          source: "provider"
                        retention: "persistent"
                        createdAt: "2026-07-27T10:15:00Z"
                        updatedAt: "2026-07-27T10:15:00Z"
                        links:
                          self:
                            href: "/networks/01984f2e-2d4b-7e32-8b21-4653f38bedd0"
                          operation:
                            href: "/networks/01984f2e-2d4b-7e32-8b21-4653f38bedd0/operation"
                          prefixes:
                            href: "/prefixes?filters[networkId][eq]=01984f2e-2d4b-7e32-8b21-4653f38bedd0"
                          ipAddresses:
                            href: "/networks/01984f2e-2d4b-7e32-8b21-4653f38bedd0/ip-addresses"
                    links:
                      self:
                        href: "/networks?limit=2"
                      next:
                        href: "/networks?limit=2&cursor=b2Zmc2V0OjI"
                empty:
                  summary: No networks yet
                  value:
                    items: []
                    links:
                      self:
                        href: "/networks"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Bad Request - the request names an unknown filter field, or a
            known filter field with an unsupported operator
            (code E020013).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unknownFilterField:
                  summary: Unknown filter field
                  value:
                    title: "Unknown filter field"
                    status: 400
                    detail: "unknown filter field 'vlan'; supported fields: fabric, name, state"
                    code: "E020013"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                unsupportedOperator:
                  summary: Known filter field with an unsupported operator
                  value:
                    title: "Unknown filter field"
                    status: 400
                    detail: "unsupported filter \"filters[name][eq]\" for field 'name'; supported: filters[name][contains]"
                    code: "E020013"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Unprocessable Content - a filter value or the cursor fails
            validation (code E020001).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidCursor:
                  summary: Cursor was not issued for this listing
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "cursor is not a cursor previously issued for this listing"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '500':
          $ref: '#/components/responses/InternalError'

  /networks/{networkId}:
    parameters:
      - in: path
        name: networkId
        description: |
          Client-generated UUID of the network. On `PUT` it MUST be a v7
          (time-ordered) UUID and is also the idempotency key: retries of the
          same logical create MUST reuse it. `GET`, `PATCH` and `DELETE`
          take any well-formed UUID - the version is not re-checked on an
          existing identity, and a UUID that names nothing readable on your
          account is a `404` like any other unknown one.
        required: true
        schema:
          type: string
          format: uuid
        example: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
    put:
      summary: Create a network (idempotent, create-only)
      description: |
        Declares a network. Acceptance returns `202` with an operation
        reference; the network record is created with `state=provisioning`
        and one orchestration provisions the underlying segment and the
        initial prefixes.

        Initial prefixes depend on connectivity:
        - `public` networks MUST state `addressing.prefixes[]` explicitly -
          a public prefix is billable and geo-pinned, so there is no
          default; a public create without `prefixes[]` is a `422`.
        - `private` networks take `addressing.prefixes[]` when given,
          otherwise exactly one /24 is derived, carved so it does not
          overlap any private prefix you already hold.
        - `addressing.source: none` provisions zero prefixes.

        **Idempotency.** The path UUID is the
        idempotency key. An identical replay returns `202` with the SAME
        operation reference and starts nothing new. The same UUID with a
        different body returns `409` (code E020003); a body that differs
        only in `name` is a replay, not a conflict, and never changes the
        stored name (rename with `PATCH`). `PUT` is create-only: it never
        acts as a whole-document replacement of an existing network. Day-2
        changes are made one resource at a time.
      operationId: createNetwork
      x-required-permission: network:network:create
      x-required-permission-description: Create a network on your account.
      x-audience: customer-facing
      tags:
        - Networks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkCreateRequest'
            examples:
              publicWithExplicitPrefixes:
                summary: Public network with explicit initial prefixes (required for public)
                value:
                  connectivity:
                    type: "public"
                  fabric: "montreal-a"
                  name: "web tier"
                  addressing:
                    source: "provider"
                    prefixes:
                      - family: 4
                        size: 24
                  contractId: "PD-2026-000481"
              privateWithDerivedPrefix:
                summary: Private network, subnet derived (one /24, no prefixes[] needed)
                value:
                  connectivity:
                    type: "private"
                  fabric: "montreal-a"
                  name: "db tier"
                  retention: "persistent"
                  contractId: "PD-2026-000481"
              privateStandaloneNoAddressing:
                summary: Private standalone Layer 2 segment with no addressing
                value:
                  connectivity:
                    type: "private"
                  fabric: "rotterdam-a"
                  addressing:
                    source: "none"
      responses:
        '202':
          description: |
            Accepted - the network is being provisioned. The body is the
            network representation with `state=provisioning`;
            `links.operation` is the operation reference. An
            identical replay of the same `PUT` returns `202` with the SAME
            operation reference.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponse'
              examples:
                accepted:
                  summary: Create accepted (`vlanId` is not known yet, so it is absent)
                  value:
                    id: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                    state: "provisioning"
                    connectivity:
                      type: "public"
                    fabric: "montreal-a"
                    name: "web tier"
                    addressing:
                      source: "provider"
                    retention: "persistent"
                    createdAt: "2026-07-27T09:00:00Z"
                    updatedAt: "2026-07-27T09:00:00Z"
                    links:
                      self:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf"
                      operation:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf/operation"
                      prefixes:
                        href: "/prefixes?filters[networkId][eq]=01984f2e-1c3a-7d21-9d10-3542f27adccf"
                      ipAddresses:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf/ip-addresses"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Conflict. Either this UUID already denotes a network created with
            a different body (code E020003) - `PUT` never replaces an
            existing network - or the create would exceed your account's
            network limit for the fabric, or the prefix limit for the
            initial prefixes it declares (code E020016), or the account is
            not authorised for self-serve creation of networks at all
            because no contract covers it (code E020017), or the
            `contractId` does not authorise the type of a declared initial
            prefix (code E020031). The network itself is checked first, so
            an account refused both ways answers E020017. In every case
            nothing is created and no operation is started.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                sameUuidDifferentBody:
                  summary: Same UUID, different body
                  value:
                    title: "Idempotency conflict"
                    status: 409
                    detail: "network 01984f2e-1c3a-7d21-9d10-3542f27adccf exists with a different create request; PUT never replaces an existing network - use a new UUID for a new network"
                    code: "E020003"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                networkQuotaExceeded:
                  summary: Network limit for the fabric reached
                  value:
                    title: "Quota exceeded"
                    status: 409
                    detail: "your limit of 5 networks in fabric 'montreal-a' has been reached (5 in use); release one you no longer need, or contact i3D.net support to request a higher limit"
                    code: "E020016"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                contractRequired:
                  summary: No contract covers self-serve creation for this account
                  value:
                    title: "Contract required"
                    status: 409
                    detail: "creating networks on this account requires a contract with i3D.net; contact i3D.net support to arrange one"
                    code: "E020017"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                contractNotAuthorised:
                  summary: The contractId does not authorise a declared initial prefix
                  value:
                    title: "Contract does not authorise this resource"
                    status: 409
                    detail: "contract PD-2026-000481 does not authorise creating IPv6 addresses and prefixes on this account; use a contract that covers this resource type, or contact i3D.net support to have it added to the contract"
                    code: "E020031"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                initialPrefixQuotaExceeded:
                  summary: Prefix limit under one contract reached by the declared initial prefixes
                  value:
                    title: "Quota exceeded"
                    status: 409
                    detail: "your limit of 2 prefixes under contract PD-2026-000481 has been reached (1 in use); this request asked for 3 more; contact i3D.net support to request a higher limit"
                    code: "E020016"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Unprocessable Content - the request parses but fails
            validation; nothing is created. Codes: E020001 (validation
            failure), E020005 (unknown public fabric identifier - the
            response lists the valid identifiers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                publicWithoutPrefixes:
                  summary: Public network without explicit prefixes
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "a public network requires explicit addressing.prefixes[] (family and size) - there is no default public prefix"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                publicWithSourceNone:
                  summary: Public network with addressing.source none
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "connectivity.type 'public' contradicts addressing.source 'none': a public network requires explicit addressing.prefixes[]"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                sourceNoneWithPrefixes:
                  summary: addressing.source none combined with prefixes
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "addressing.source 'none' contradicts a non-empty addressing.prefixes[]: remove the prefixes or use source 'provider'"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                sourceCustomer:
                  summary: Unsupported addressing.source
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "addressing.source 'customer' is not supported; supported values: provider, none"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                unknownFabric:
                  summary: Unknown public fabric identifier
                  value:
                    title: "Unknown fabric identifier"
                    status: 422
                    detail: "unknown fabric 'montreal-x'; valid public fabric identifiers: amsterdam-a, frankfurt-a, montreal-a, rotterdam-a, singapore-a, tokyo-a"
                    code: "E020005"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                customerDeclaredEphemeral:
                  summary: Customer identity declaring ephemeral retention
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "retention 'ephemeral' is not available on this account; omit retention or declare persistent"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                contractMissing:
                  summary: Persistent network with provider addressing and no contractId
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "contractId is required for a persistent resource: name the contract it is billed under (pattern ^[A-Za-z0-9][A-Za-z0-9_-]{3,19}$)"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                contractWithSourceNone:
                  summary: contractId supplied with addressing.source none
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "contractId must be omitted when addressing.source is 'none': no prefix is created, so there is nothing to attribute to a contract"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                contractOnEphemeral:
                  summary: contractId supplied on a network resolving to ephemeral
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "contractId must be omitted for an ephemeral resource: ephemeral resources are not attributed to a contract"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: Get a network
      description: |
        Returns the network with its current state. A UUID that does not
        exist, belongs to another account, or names a deleted network
        reads as `404`.
      operationId: getNetworkById
      x-required-permission: network:network:read
      x-required-permission-description: Read a network and its provisioning status.
      x-audience: customer-facing
      tags:
        - Networks
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponse'
              examples:
                active:
                  summary: A provisioned network
                  value:
                    id: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                    state: "active"
                    connectivity:
                      type: "public"
                    fabric: "montreal-a"
                    name: "web tier"
                    vlanId: 3042
                    addressing:
                      source: "provider"
                    retention: "persistent"
                    createdAt: "2026-07-27T09:00:00Z"
                    updatedAt: "2026-07-27T09:02:11Z"
                    links:
                      self:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf"
                      prefixes:
                        href: "/prefixes?filters[networkId][eq]=01984f2e-1c3a-7d21-9d10-3542f27adccf"
                      ipAddresses:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf/ip-addresses"
                routedPrivate:
                  summary: A private network i3D.net connected to your other networks
                  value:
                    id: "01984f2e-3e5c-7f43-9c32-5764f49cfee1"
                    state: "active"
                    connectivity:
                      type: "private"
                      routing:
                        enabled: true
                        routingDomainId: "01984f2e-9a01-7cc1-8a44-1f27adccf001"
                    fabric: "rotterdam-a"
                    name: "rotterdam-a private 1"
                    vlanId: 2210
                    addressing:
                      source: "provider"
                    retention: "ephemeral"
                    createdAt: "2026-10-02T09:00:00Z"
                    updatedAt: "2026-10-02T09:00:00Z"
                    links:
                      self:
                        href: "/networks/01984f2e-3e5c-7f43-9c32-5764f49cfee1"
                      prefixes:
                        href: "/prefixes?filters[networkId][eq]=01984f2e-3e5c-7f43-9c32-5764f49cfee1"
                      ipAddresses:
                        href: "/networks/01984f2e-3e5c-7f43-9c32-5764f49cfee1/ip-addresses"
                failed:
                  summary: Provisioning failed - the reason is in `error`
                  value:
                    id: "01984f2e-2d4b-7e32-8b21-4653f38bedd0"
                    state: "failed"
                    connectivity:
                      type: "private"
                      routing:
                        enabled: false
                    fabric: "rotterdam-a"
                    addressing:
                      source: "provider"
                    retention: "persistent"
                    error:
                      code: "NETWORK_PROVISIONING_FAILED"
                      message: "network provisioning failed"
                    createdAt: "2026-07-27T10:15:00Z"
                    updatedAt: "2026-07-27T10:18:42Z"
                    links:
                      self:
                        href: "/networks/01984f2e-2d4b-7e32-8b21-4653f38bedd0"
                      operation:
                        href: "/networks/01984f2e-2d4b-7e32-8b21-4653f38bedd0/operation"
                      prefixes:
                        href: "/prefixes?filters[networkId][eq]=01984f2e-2d4b-7e32-8b21-4653f38bedd0"
                      ipAddresses:
                        href: "/networks/01984f2e-2d4b-7e32-8b21-4653f38bedd0/ip-addresses"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NetworkNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/MalformedPathParameter'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Rename a network
      description: |
        Changes the network's `name`. The body is a JSON Merge Patch
        (`application/merge-patch+json`) with one patchable member,
        `name`: a string sets the name (trimmed; empty after trim, or
        longer than 100 characters after trim, is a `422`, code E020001),
        `null` clears it (the network reads as unnamed and the response
        omits `name`), and an omitted member leaves it unchanged, so `{}`
        is a valid no-op that returns the current representation. Any
        other member is a `422` (code E020001) naming it, and nothing
        changes.

        Synchronous: `200` with the full network representation and a
        fresh `ETag`; there is no operation to poll. `updatedAt` reflects
        the edit. The rename does not depend on the network's state: a
        `provisioning` or `failed` network can be renamed, and the running
        or failed operation is unaffected. A network i3D.net manages
        (`retention: ephemeral`) is read-only and answers `409` (code
        E020019). Last-write-wins: no `If-Match` precondition is required,
        see the caching note in this document's description.
      operationId: patchNetwork
      x-required-permission: network:network:update
      x-required-permission-description: Rename a network on your account.
      x-audience: customer-facing
      tags:
        - Networks
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/NetworkPatchRequest'
            examples:
              rename:
                summary: Set a new name
                value:
                  name: "db tier"
              clear:
                summary: Clear the name
                value:
                  name: null
              noop:
                summary: Empty patch (no-op)
                value: {}
      responses:
        '200':
          description: |
            OK - the network as it reads after the edit, with a fresh
            strong `ETag`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponse'
              examples:
                renamed:
                  summary: Renamed network
                  value:
                    id: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                    state: "active"
                    connectivity:
                      type: "public"
                    fabric: "montreal-a"
                    name: "db tier"
                    vlanId: 3042
                    addressing:
                      source: "provider"
                    retention: "persistent"
                    createdAt: "2026-07-27T09:00:00Z"
                    updatedAt: "2026-07-28T14:30:05Z"
                    links:
                      self:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf"
                      prefixes:
                        href: "/prefixes?filters[networkId][eq]=01984f2e-1c3a-7d21-9d10-3542f27adccf"
                      ipAddresses:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf/ip-addresses"
        '400':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Bad Request - the request body does not parse as JSON (code
            E020001). A body that parses but is not a JSON object, or
            carries a member other than `name`, is a `422` instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                malformedJson:
                  summary: Body is not valid JSON
                  value:
                    title: "Validation failure"
                    status: 400
                    detail: "request body is not valid JSON"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NetworkNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Conflict - the network is managed by i3D.net and is read-only
            here (code E020019). Answered after the tenancy check (a
            network that is not yours stays a `404`) and before
            validation. The name is unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                platformManaged:
                  summary: The network is managed by i3D.net
                  value:
                    title: "Resource is managed by i3D.net"
                    status: 409
                    detail: "this network was set up by i3D.net on your behalf and is managed by i3D.net. It is removed automatically; it cannot be changed or deleted here, and prefixes cannot be added to it. Contact i3D.net support if you need it changed or removed."
                    code: "E020019"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Unprocessable Content - the body parses but is not a valid
            patch, or `networkId` is not a well-formed UUID; nothing
            changes (code E020001). `detail` names the member or
            parameter: `name` is empty after trimming or longer than 100
            characters after trimming, `name` is not a string or `null`,
            or the body carries a member other than `name`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                emptyName:
                  summary: Whitespace-only name
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "name must not be empty or whitespace-only; send null to clear the name or a non-empty value to set it"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                nameTooLong:
                  summary: Name longer than 100 characters after trimming
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "name must be at most 100 characters after trimming, got 101"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                unknownMember:
                  summary: A member other than name
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "fabric is not patchable; the only patchable member is name"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                malformedNetworkId:
                  summary: networkId is not a UUID
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "networkId is not a valid UUID"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a network (guarded, asynchronous)
      description: |
        Tears down the network and its children. Refused with `409` (code
        E020004) while ANY IP address is still in use under the network's
        prefixes, whatever its retention. Addresses are released when the
        servers using them are decommissioned. Otherwise returns
        `202` with an operation reference; children are removed first,
        then the network is deleted.

        Idempotent: repeating the `DELETE` continues a previously failed
        teardown instead of failing. Once the teardown has completed, the
        network reads as `404` (`GET` and `DELETE` alike) and no longer
        appears in listings - the completed operation is your
        confirmation.
      operationId: deleteNetwork
      x-required-permission: network:network:delete
      x-required-permission-description: Delete a network from your account.
      x-audience: customer-facing
      tags:
        - Networks
      responses:
        '202':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Accepted - teardown is running. `links.operation` is the
            operation reference; a repeated `DELETE` returns the
            operation reference of the teardown it continues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDeleteAccepted'
              examples:
                accepted:
                  summary: Delete accepted
                  value:
                    id: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                    links:
                      operation:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf/operation"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Not Found - the network does not exist on your account, or it
            was already deleted (code E020002).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                alreadyDeleted:
                  summary: Re-delete after a completed teardown
                  value:
                    title: "Network not found"
                    status: 404
                    detail: "network 01984f2e-1c3a-7d21-9d10-3542f27adccf does not exist"
                    code: "E020002"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Conflict - the network is managed by i3D.net and is read-only
            here (code E020019), or the account is not authorised to remove
            resources it provisioned for itself because no contract covers
            them (code E020018), or the delete is blocked because IP
            addresses are still in use under the network's prefixes (code
            E020004).
            They are answered in that order, and both refusals ahead of
            E020004 for the same reason: someone who cannot clear the
            blocking addresses must not be told to clear them. A network with
            no contract AND managed by i3D.net answers E020019, because
            arranging a contract would not make the request succeed.
            E020019 also covers a network the account owns whose prefixes
            include one managed by i3D.net - deleting the network would tear
            that prefix down with it. That variant's detail is about the
            NETWORK ("this network holds a prefix that was set up by
            i3D.net ..."), not about the prefix: the request named a network.
            It names no prefix id; `retention` on the prefix listing is where
            the blocking prefix is identified.
            Re-driving a teardown that was already accepted is never refused
            by E020018 or E020019.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                platformManaged:
                  summary: The network is managed by i3D.net
                  value:
                    title: "Resource is managed by i3D.net"
                    status: 409
                    detail: "this network was set up by i3D.net on your behalf and is managed by i3D.net. It is removed automatically; it cannot be changed or deleted here, and prefixes cannot be added to it. Contact i3D.net support if you need it changed or removed."
                    code: "E020019"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                contractRequired:
                  summary: No contract covers this account's self-serve resources
                  value:
                    title: "Contract required"
                    status: 409
                    detail: "removing networks on this account requires a contract with i3D.net; contact i3D.net support to arrange one"
                    code: "E020018"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                addressesInUse:
                  summary: Delete blocked by IP addresses in use
                  value:
                    title: "Delete blocked by IP addresses in use"
                    status: 409
                    detail: "network 01984f2e-1c3a-7d21-9d10-3542f27adccf still holds 3 IP addresses in use (e.g. 01984f2e-aa01-7bb2-8c11-1f27adccf111); decommission the servers using them, then retry the delete"
                    code: "E020004"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '422':
          $ref: '#/components/responses/MalformedPathParameter'
        '500':
          $ref: '#/components/responses/InternalError'

  /networks/{networkId}/operation:
    get:
      summary: Get a network's current or last operation
      description: |
        Returns the async operation attached to the network: the
        running or terminally failed create, or the running, failed, or
        completed delete. This is the resource behind the `links.operation`
        reference returned by `PUT` and `DELETE`; an idempotent replay of
        either returns the SAME reference to this resource. `404` when no
        operation record exists for the UUID (unknown network, foreign
        account, or nothing recorded).
      operationId: getNetworkOperation
      x-required-permission: network:network:read
      x-required-permission-description: Read a network and its provisioning status.
      x-audience: customer-facing
      tags:
        - Networks
      parameters:
        - in: path
          name: networkId
          description: UUID of the network the operation belongs to.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
