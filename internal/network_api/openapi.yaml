  /networks/{networkId}/ip-addresses:
    parameters:
      - in: path
        name: networkId
        description: |
          UUID of the network. Any well-formed UUID is accepted - a
          network that does not exist, belongs to another account, or
          is deleted reads as `404` (default deny - existence is not
          disclosed).
        required: true
        schema:
          type: string
          format: uuid
        example: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
    get:
      summary: List all IP addresses under a network
      description: |
        Lists ALL IP addresses that exist under the network's prefixes - allocated addresses and
        infrastructure addresses alike. Role derivation (`gateway` /
        `router-ip` / `reserved`, omitted when none) is identical to
        the prefix-scoped listing
        (`GET /prefixes/{prefixId}/ip-addresses`): the two listings
        never disagree about what exists. Items are the same
        `IPAddressResponse` objects - each carries its `prefixId` and
        its canonical `links.self`. Address-pool prefixes
        are excluded entirely: a pool is never an allocation target and
        its address objects are not the network's addresses.

        Availability is exposed as counters only (`capacity`,
        `allocated`, `available`), aggregated across ALL the network's
        non-pool prefixes and BOTH address families - the per-family
        view is the prefix-scoped listing. Per-prefix counter semantics
        carry over into the sum, including saturation at the maximum
        int64 value. Free addresses are NEVER enumerated. `available`
        is the number of addresses that can still be allocated under
        the network.

        The listing does NOT require `state: active`: provisioning and
        failed networks answer `200` - a network without a provisioned
        segment yet yields an empty page with all counters 0. A network
        that does not exist,
        belongs to another account, or is deleted reads as `404` (default
        deny, code E020002) - existence is never disclosed.

        Cursor-paginated with a deterministic cross-prefix order. Page
        links (`links.next` / `links.prev`) are identity-free and
        followable verbatim. The listing reads live address data - it is
        not a cached copy.
      operationId: listNetworkIPAddresses
      x-required-permission: network:ip-address:list
      x-required-permission-description: List the IP addresses in your networks and prefixes.
      x-audience: customer-facing
      tags:
        - IP Addresses
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK - one page of IP address objects, with aggregated counters
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkIPAddressListResponse'
              examples:
                page:
                  summary: Addresses across the network's prefixes
                  value:
                    items:
                      - id: "01984f2e-aa01-7bb2-8c11-1f27adccf111"
                        address: "10.0.0.1"
                        family: 4
                        prefixId: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                        role: "gateway"
                        created: "2026-07-27T09:00:00Z"
                        links:
                          self:
                            href: "/prefixes/01984f2e-bb02-7cc3-9d22-2f27adccf222/ip-addresses/01984f2e-aa01-7bb2-8c11-1f27adccf111"
                      - id: "01984f2e-aa02-7bb2-8c11-1f27adccf112"
                        address: "10.0.0.10"
                        family: 4
                        prefixId: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                        created: "2026-07-27T09:05:00Z"
                        links:
                          self:
                            href: "/prefixes/01984f2e-bb02-7cc3-9d22-2f27adccf222/ip-addresses/01984f2e-aa02-7bb2-8c11-1f27adccf112"
                      - id: "01984f2e-aa03-7bb2-8c11-1f27adccf113"
                        address: "10.0.1.1"
                        family: 4
                        prefixId: "01984f2e-bb03-7cc3-9d22-2f27adccf333"
                        role: "gateway"
                        created: "2026-07-28T08:02:00Z"
                        links:
                          self:
                            href: "/prefixes/01984f2e-bb03-7cc3-9d22-2f27adccf333/ip-addresses/01984f2e-aa03-7bb2-8c11-1f27adccf113"
                    capacity: 508
                    allocated: 8
                    available: 500
                    links:
                      self:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf/ip-addresses"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NetworkNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Unprocessable Content - the request parses but fails
            validation, e.g. the cursor value does not decode as a
            cursor issued by this API (code E020001).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidCursor:
                  summary: Cursor was not issued for this listing
                  value:
                    title: "Validation failure"
                    status: 422
                    detail: "cursor is not a cursor previously issued for this listing"
                    code: "E020001"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
        '500':
          $ref: '#/components/responses/InternalError'


  /prefixes:
    get:
      summary: List prefixes
      description: |
        Lists your prefixes. Locations are public fabric slugs and
        metro names (internal location names never appear), and
        prefixes provisioned through a network carry `networkId`.
        Cursor-paginated; filters use the `filters[field][op]` syntax.
        The listing carries NO availability counters - read a single
        prefix (`GET /prefixes/{prefixId}`) for
        `capacity`/`allocated`/`available`.

        **Account scope.** The result is always the prefixes on your own
        account. There is no account parameter and no cross-account
        search.

        **Filter combinations.** Filters AND-combine, except
        `filters[fabric][eq]` and
        `filters[metro][eq]`, which are mutually exclusive - combining
        them returns `422` (code E020001).

        An unknown filter field is a `400` (code E020013). An unknown
        `filters[networkId][eq]` value - including another account's
        network - yields an empty page, not an error: filters narrow,
        they don't probe existence.
      operationId: listPrefixes
      x-required-permission: network:prefix:list
      x-required-permission-description: List the prefixes on your account.
      x-audience: customer-facing
      tags:
        - Prefixes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: filters[family][eq]
          description: "Filter by IP family: 4 or 6, for IPv4 or IPv6 respectively."
          required: false
          schema:
            type: integer
            enum: [4, 6]
          example: 4
        - in: query
          name: filters[fabric][eq]
          description: |
            Filter by public fabric identifier (as served by the fabrics
            listing). Mutually exclusive with
            `filters[metro][eq]`.
          required: false
          schema:
            type: string
          example: "montreal-a"
        - in: query
          name: filters[metro][eq]
          description: |
            Filter by public metro name (as served by the fabrics
            listing). Mutually exclusive with `filters[fabric][eq]`.
          required: false
          schema:
            type: string
          example: "Montreal"
        - in: query
          name: filters[cidr][contains]
          description: |
            Network containment filter: returns the prefixes that CONTAIN
            the given IP address or CIDR (e.g. `10.0.0.5` matches
            `10.0.0.0/24`). This is address-math containment, NOT string
            substring matching.
          required: false
          schema:
            type: string
          example: "10.0.0.5"
        - in: query
          name: filters[state][eq]
          description: |
            Filter by prefix state. `provisioning` and `failed` are set
            while a create is in flight or has failed and are not
            filterable. When omitted, prefixes in all states are
            returned.
          required: false
          schema:
            type: string
            enum: [container, active, reserved, deprecated]
          example: "active"
        - in: query
          name: filters[connectivity][eq]
          description: |
            Filter by the connectivity class of the prefix, matching
            `connectivity.type` in the representation and the same two
            values a network uses: `public` for internet-connected
            address space, `private` for address space in an isolated
            segment.
          required: false
          schema:
            type: string
            enum: [public, private]
          example: "public"
        - in: query
          name: filters[networkId][eq]
          description: |
            Filter by the network that owns the prefixes (children
            discovery). An unknown network - including another account's -
            yields an empty page.
          required: false
          schema:
            type: string
            format: uuid
          example: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
      responses:
        '200':
          description: OK - one page of prefixes
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixListResponse'
              examples:
                page:
                  summary: The two prefixes of one network
                  value:
                    items:
                      - id: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                        cidr: "10.0.0.0/24"
                        family: 4
                        state: "active"
                        fabric: "montreal-a"
                        metro: "Montreal"
                        customerDescription: "edge pool, EU traffic"
                        vlanId: 3042
                        gatewayIp: "10.0.0.1"
                        routerIps:
                          - "10.0.0.2"
                          - "10.0.0.3"
                        connectivity:
                          type: public
                        networkId: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                        retention: "persistent"
                        contractId: "PD-2026-000481"
                        created: "2026-07-27T09:00:00Z"
                        lastUpdated: "2026-07-27T09:02:11Z"
                        links:
                          self:
                            href: "/prefixes/01984f2e-bb02-7cc3-9d22-2f27adccf222"
                      - id: "01984f2e-bb03-7cc3-9d22-2f27adccf333"
                        cidr: "10.0.1.0/24"
                        family: 4
                        state: "provisioning"
                        fabric: "montreal-a"
                        metro: "Montreal"
                        vlanId: 3042
                        connectivity:
                          type: public
