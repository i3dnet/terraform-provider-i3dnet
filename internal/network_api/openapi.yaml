  /prefixes/{prefixId}:
    parameters:
      - in: path
        name: prefixId
        description: |
          Client-generated UUID of the prefix. On `PUT` it MUST be a v7
          (time-ordered) UUID and is also the idempotency key: retries of
          the same logical create MUST reuse it. `GET` and `DELETE` take
          any well-formed UUID - the version is not re-checked on an
          existing identity, and a UUID that names nothing readable for
          your account is a `404` like any other unknown one.
        required: true
        schema:
          type: string
          format: uuid
        example: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
    put:
      summary: Create a prefix in a network (idempotent, create-only)
      description: |
        Declares an additional prefix in an existing network - the day-2
        grow step for a network that is running out of addresses.
        Acceptance returns `202` with an operation reference;
        the prefix is provisioned asynchronously in the referenced
        network.

        The request names the owning network by `networkId` (required).
        A `networkId` that does not exist on your account - including
        another account's network - is a `422` with guidance; a network
        is never auto-created as a side effect. The prefix shape is
        `family` + `size` (both required): the concrete subnet is
        selected by i3D.net during provisioning - customers never
        pick the subnet. A request naming an explicit `cidr`
        is a `422` with guidance; an explicit-cidr capability, if ever
        ratified, would be a separate contract change.

        For private networks the concrete subnet is carved so that it
        does not overlap any private prefix you already hold.

        `retention` MAY be omitted: it defaults to the owning network's
        retention; an explicit value overrides the default. The
        rule applies to the RESOLVED value: a resource on your account
        can never end up `ephemeral`, whether you declared it or it came
        from the network (such a request is a `422`).

        `contractId` names the contract the prefix is billed under. It
        is decided on the RESOLVED `retention`: REQUIRED for
        `persistent`, FORBIDDEN for `ephemeral`; each refusal is a
        `422` naming
        `contractId` in `detail`. Only the format is verified, never
        the contract's existence. The value is recorded per prefix and
        is immutable. Because validation runs before the idempotency
        settlement, a replay whose body omits `contractId` for a
        `persistent` prefix is a `422`, not a `409`.

        **Idempotency.** The path UUID is the
        idempotency key. An identical replay returns `202` with the
        SAME operation reference and provisions nothing new. The same
        UUID with a different body returns `409` (code E020003). `PUT`
        is create-only: it never replaces an existing prefix. A UUID
        with a delete operation attached - a delete in progress, or a
        retained failed-delete tombstone - is also a `409` with the
        same code E020003: a deleted identity is never re-created, and
        the recorded create request is not even compared - a new prefix
        needs a NEW UUID.

        Once provisioned, the prefix is discoverable via
        `filters[networkId][eq]` on the prefix listing.
      operationId: createPrefix
      x-required-permission: network:prefix:create
      x-required-permission-description: Create a prefix in one of your networks.
      x-audience: customer-facing
      tags:
        - Prefixes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrefixCreateRequest'
            examples:
              dayTwoBySize:
                summary: Day-2 prefix by size (subnet selected by i3D.net)
                value:
                  networkId: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                  family: 4
                  size: 24
                  contractId: "PD-2026-000481"
              declaredPersistent:
                summary: Day-2 prefix with declared persistent retention
                value:
                  networkId: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                  family: 4
                  size: 24
                  retention: "persistent"
                  contractId: "PD-2026-000481"
      responses:
        '202':
          description: |
            Accepted - the prefix is being provisioned. The body echoes
            the recorded request with the RESOLVED `retention`;
            `links.operation` is the operation reference. An
            identical replay of the same `PUT` returns `202` with the
            SAME operation reference.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixCreateAccepted'
              examples:
                accepted:
                  summary: Create accepted
                  value:
                    id: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                    state: "provisioning"
                    networkId: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                    family: 4
                    size: 24
                    retention: "persistent"
                    contractId: "PD-2026-000481"
                    createdAt: "2026-07-27T09:00:00Z"
                    updatedAt: "2026-07-27T09:00:00Z"
                    links:
                      operation:
                        href: "/prefixes/01984f2e-bb02-7cc3-9d22-2f27adccf222/operation"
                      network:
                        href: "/networks/01984f2e-1c3a-7d21-9d10-3542f27adccf"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Conflict. This UUID cannot denote a new prefix (code
            E020003 for both branches):
            - the UUID already denotes a prefix created with a
              different body - `PUT` never replaces an existing prefix;
              nothing is changed;
            - a delete operation is in progress (or has failed) for
              this UUID - a deleted identity is never re-created and
              the recorded create request is not compared; a new prefix
              needs a NEW UUID.

            Or the referenced network is one i3D.net manages, so it takes no
            customer prefixes (code E020019). Or the referenced network
            cannot take a prefix in its
            current state (code E020007) - it is not `active`, or its DELETE has
            already been accepted, which its `state` does not yet show
            because a network is not marked `deleted` until its teardown
            fully succeeds; a prefix added then would be destroyed while
            still provisioning or stranded on a deleted network, so the
            remedy is a different network rather than a retry. Or the
            create would exceed your
            prefix limit for the network or for the contract (code
            E020016), or the `contractId` does not authorise the prefix's
            type for your account (code E020031; never E020017, which is
            returned only for networks).
            In every case nothing is created and no operation is started.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                sameUuidDifferentBody:
                  summary: Same UUID, different body
                  value:
                    title: "Idempotency conflict"
                    status: 409
                    detail: "prefix 01984f2e-bb02-7cc3-9d22-2f27adccf222 exists with a different create request; PUT never replaces an existing prefix - use a new UUID for a new prefix"
                    code: "E020003"
                    traceId: "0af7651916cd43dd8448eb211c80319c"
                deleteInProgress:
