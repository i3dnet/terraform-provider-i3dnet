    patch:
      summary: Edit a prefix's description
      description: |
        On public/gateway mounts every resource write, including retries, requires an explicit owned
        contract registration (409 E020048). Internal operations retain their existing authorization
        rules. Ownership, managed-resource and lifecycle guards remain.
        Changes the prefix's `customerDescription`. The body is a JSON
        Merge Patch (`application/merge-patch+json`) with one patchable
        member, `customerDescription`: a string sets it (trimmed; empty
        after trim, longer than 200 characters, or containing control
        characters is a `422`, code E020001), `null` clears it (the
        response omits `customerDescription`), and an omitted member
        leaves it unchanged, so `{}` is a valid no-op that returns the
        current representation. Any other member is a `422` (code
        E020001) naming it, and nothing changes. The `description`
        member is maintained by i3D.net and cannot be edited here: a body
        carrying it is a `422` like any other unknown member.

        Synchronous: `200` with the prefix as it reads after the edit,
        in the same representation `GET /prefixes/{prefixId}` serves
        (availability counters included), with `links.self` only and a
        fresh `ETag`; there is no operation to poll and nothing changes
        on your servers or the network.

        Refusals, in order: a prefix that does not exist on your account
        is a `404` (code E020002). A prefix i3D.net manages (`retention:
        ephemeral`) is read-only and answers `409` (code E020019). A
        prefix with an operation still pending - a create that has not
        finished, a failed create that is still retained, or a delete in
        progress - answers `409` (code E020024) saying which. Only an
        in-flight create is worth waiting for: once it finishes, the same
        edit succeeds. A failed prefix cannot be edited (delete it or
        create a new one), and after a delete the prefix is gone.
        Validation runs after these refusals. Last-write-wins: no `If-Match` precondition is
        required, see the caching note in this document's description.
      operationId: patchPrefix
      x-required-permission: network:prefix:update
      x-required-permission-description: Edit the description of a prefix on your account.
      x-audience: customer-facing
      tags:
        - Prefixes
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PrefixPatchRequest'
            examples:
              describe:
                summary: Set a new description
                value:
                  customerDescription: "edge pool, EU traffic"
              clear:
                summary: Clear the description
                value:
                  customerDescription: null
              noop:
                summary: Empty patch (no-op)
                value: {}
      responses:
        '200':
          description: |
            OK - the prefix as it reads after the edit, with its
            availability counters and a fresh strong `ETag`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixDetailResponse'
              examples:
                described:
                  summary: Prefix with its new description
                  value:
                    id: "01984f2e-bb02-7cc3-9d22-2f27adccf222"
                    cidr: "10.0.0.0/24"
                    family: 4
                    state: "active"
                    fabric: "montreal-a"
                    metro: "Montreal"
                    customerDescription: "edge pool, EU traffic"
                    vlanId: 3042
                    gatewayIp: "10.0.0.1"
                    routerIps:
                      - "10.0.0.2"
                      - "10.0.0.3"
                    connectivity:
                      type: public
                    networkId: "01984f2e-1c3a-7d21-9d10-3542f27adccf"
                    retention: "persistent"
                    contractId: "PD-2026-000481"
                    created: "2026-07-27T09:00:00Z"
                    lastUpdated: "2026-07-28T14:30:05Z"
                    capacity: 254
                    allocated: 5
                    available: 249
                    links:
                      self:
                        href: "/prefixes/01984f2e-bb02-7cc3-9d22-2f27adccf222"
        '400':
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Bad Request - the request body does not parse as JSON (code
            E020001). A body that parses but is not a JSON object, or
            carries a member other than `customerDescription`, is a `422`
            instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                malformedJson:
                  summary: Body is not valid JSON
                  value:
