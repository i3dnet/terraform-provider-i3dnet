# oapi-codegen configuration for the Network API client. Run through
# `make generate`, which executes go generate in tools/, so the paths below are
# relative to tools/.
package: network_api
generate:
  models: true
  client: true
output: ../internal/network_api/client.gen.go
output-options:
  # A nullable field (e.g. customerDescription on PATCH /prefixes/{id}) becomes nullable.Nullable[T], so a merge
  # patch can tell "leave unchanged" (omitted) from "clear" (null) and "set" (a value).
  nullable-type: true
